name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -e ".[dev]"
      - run: pytest

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build "twine>=6.0"
      - run: python -m build
      - run: python -m twine check dist/*

  wheel-smoke:
    name: Pure-wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      - name: Require a platform-independent wheel
        shell: bash
        run: compgen -G "dist/*-py3-none-any.whl" > /dev/null
      - run: python -m pip install "rqm-core>=0.2.2,<0.3" "rqm-entanglement>=0.2,<0.3" "rqm-compiler>=0.3,<0.4" "qiskit>=2.5.1,<2.6" dist/*.whl
        shell: bash
      - run: python -c "from qiskit import QuantumCircuit; from rqm_qiskit import analyze_qiskit_circuit; circuit = QuantumCircuit(1); circuit.h(0); assert analyze_qiskit_circuit(circuit).status == 'complete'"
