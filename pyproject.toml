[project]
name = "rqm-qiskit"
version = "0.4.0"
description = "Evidence-backed quaternionic geometric lens and Qiskit bridge for the RQM ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qiskit>=2.5.1,<2.6",
  "rqm-core>=0.2,<0.3",
  "rqm-entanglement>=0.2,<0.3",
  "rqm-compiler>=0.3,<0.4",
]

[project.optional-dependencies]
simulator = ["qiskit-aer==0.17.2"]
qasm3 = ["qiskit-qasm3-import==0.6.0"]
cli = ["qiskit-qasm3-import==0.6.0"]
ibm = ["qiskit-ibm-runtime>=0.48,<0.49"]
dev = ["pytest", "qiskit-aer==0.17.2", "qiskit-qasm3-import==0.6.0"]

[project.scripts]
rqm-qiskit = "rqm_qiskit.cli:main"

[project.urls]
Homepage = "https://github.com/RQM-Technologies-dev/rqm-qiskit"
Repository = "https://github.com/RQM-Technologies-dev/rqm-qiskit"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*", "*-manylinux_i686", "*-win32"]
test-command = "python -c \"from rqm_qiskit._accelerator import native_build_info; assert native_build_info()['available']\""
