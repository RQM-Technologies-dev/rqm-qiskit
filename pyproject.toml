[project]
name = "rqm-qiskit"
version = "0.2.0"
description = "Thin Qiskit bridge layer for the RQM quantum ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qiskit==2.5.1",
  "rqm-core>=0.2,<0.3",
  "rqm-entanglement>=0.2,<0.3",
  "rqm-compiler>=0.2.1,<0.3",
]

[project.optional-dependencies]
simulator = ["qiskit-aer==0.17.2"]
qasm3 = ["qiskit-qasm3-import==0.6.0"]
ibm = ["qiskit-ibm-runtime==0.48.0"]
dev = ["pytest", "qiskit-aer==0.17.2", "qiskit-qasm3-import==0.6.0"]

[project.urls]
Homepage = "https://github.com/RQM-Technologies-dev/rqm-qiskit"
Repository = "https://github.com/RQM-Technologies-dev/rqm-qiskit"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
