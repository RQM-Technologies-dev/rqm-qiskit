[project]
name = "rqm-qiskit"
dynamic = ["version"]
description = "Thin Qiskit bridge layer for the RQM quantum ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "qiskit==2.3.0",
  "rqm-core @ git+https://github.com/RQM-Technologies-dev/rqm-core.git@f3a9988871e4f9f44c85a2b0ac726014ada3b58b",
  "rqm-entanglement @ git+https://github.com/RQM-Technologies-dev/rqm-entanglement.git@ca121885cdc75058483646ebcb342c202a5a8013",
  "rqm-compiler @ git+https://github.com/RQM-Technologies-dev/rqm-compiler.git@ae89a3e91b0f3a85a06a44f4401180bcb79b69dc",
]

[project.optional-dependencies]
simulator = ["qiskit-aer==0.17.2"]
qasm3 = ["qiskit-qasm3-import==0.6.0"]
ibm = ["qiskit-ibm-runtime==0.45.0"]
dev = ["pytest", "qiskit-aer==0.17.2"]

[project.urls]
Homepage = "https://github.com/RQM-Technologies-dev/rqm-qiskit"
Repository = "https://github.com/RQM-Technologies-dev/rqm-qiskit"

[build-system]
requires = ["setuptools>=42", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"
